name: gateway-go-ci

on:
  push:
    branches: [main]
    paths:
      - "gateway-go/**"
      - ".github/workflows/gateway-go-ci.yml"
  pull_request:
    paths:
      - "gateway-go/**"
      - ".github/workflows/gateway-go-ci.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway-go/go.mod
          cache-dependency-path: gateway-go/go.sum
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
