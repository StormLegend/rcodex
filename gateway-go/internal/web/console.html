<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>rcodex · 工作空间</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --sidebar: rgba(244, 244, 246, 0.92);
        --surface: #f5f5f7;
        --raised: #fff;
        --ink: #1d1d1f;
        --muted: #77777e;
        --line: rgba(0, 0, 0, 0.075);
        --accent: #007aff;
        --accent-soft: rgba(0, 122, 255, 0.1);
        --hover: rgba(0, 0, 0, 0.045);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.035);
        --error: #c92b3c;
        --success: #248a3d;
        --sidebar-width: 260px;
        --font:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", sans-serif;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #1c1c1e;
        --sidebar: rgba(37, 37, 40, 0.96);
        --surface: #2c2c2e;
        --raised: #303033;
        --ink: #f5f5f7;
        --muted: #aaaab2;
        --line: rgba(255, 255, 255, 0.09);
        --accent: #5aa9ff;
        --accent-soft: rgba(10, 132, 255, 0.18);
        --hover: rgba(255, 255, 255, 0.055);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        --error: #ff7583;
        --success: #66d184;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:disabled {
        opacity: 0.38;
        cursor: default;
      }
      button {
        border: 0;
        background: none;
      }
      button,
      input,
      select,
      textarea {
        outline: none;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
      input,
      select,
      textarea {
        min-width: 0;
        width: 100%;
        background: var(--surface);
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 11px 12px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      textarea {
        resize: none;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      svg.icon {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .icon-button {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        flex-shrink: 0;
      }
      .icon-button:hover {
        background: var(--hover);
        color: var(--ink);
      }
      .muted,
      small {
        color: var(--muted);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .app {
        height: 100dvh;
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        transition: grid-template-columns 0.2s ease;
      }
      .sidebar {
        min-width: 0;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 26px 16px 16px;
        gap: 22px;
        overflow: hidden;
        backdrop-filter: blur(24px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 8px;
      }
      .app-icon {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(145deg, #414146, #19191b);
        color: #fff;
        box-shadow:
          0 2px 4px #0002,
          inset 0 1px 0 #ffffff2b;
        flex-shrink: 0;
      }
      .app-icon .icon {
        width: 21px;
        height: 21px;
        stroke-width: 1.8;
      }
      .brand-name {
        font-size: 20px;
        font-weight: 660;
        letter-spacing: -0.8px;
      }
      .brand-note {
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.7px;
      }
      .new-button {
        border-radius: 11px;
        background: var(--raised);
        border: 1px solid var(--line);
        box-shadow: 0 1px 2px #00000003;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 11px;
        font-weight: 550;
      }
      .new-button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .search {
        position: relative;
        margin-top: -8px;
      }
      .search .icon {
        position: absolute;
        left: 11px;
        top: 10px;
        width: 16px;
        height: 16px;
        color: var(--muted);
      }
      .search input {
        padding: 8px 10px 8px 34px;
        font-size: 12px;
        background: var(--hover);
        border-radius: 8px;
      }
      .session-section {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .section-label .icon-button {
        height: 25px;
        width: 25px;
      }
      .section-label .icon {
        width: 14px;
        height: 14px;
      }
      #sessions {
        min-height: 0;
        overflow: auto;
        display: grid;
        grid-auto-rows: min-content;
        align-content: start;
        gap: 4px;
        scrollbar-width: thin;
      }
      .session {
        min-height: 66px;
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 0 8px;
        align-items: center;
        width: 100%;
        padding: 11px 12px;
        text-align: left;
        border-radius: 10px;
        border: 1px solid transparent;
      }
      .session:hover {
        background: var(--hover);
      }
      .session.active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .session .icon {
        grid-row: 1 / 3;
        width: 17px;
        height: 17px;
        align-self: start;
        margin-top: 2px;
        color: var(--muted);
      }
      .session.active .icon {
        color: var(--accent);
      }
      .session strong {
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session small {
        font-size: 10px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .sidebar-empty {
        font-size: 12px;
        padding: 18px 12px;
        color: var(--muted);
        line-height: 1.8;
      }
      .text-button {
        color: var(--accent);
        font-size: 12px;
        padding: 8px;
        border-radius: 8px;
      }
      .text-button:hover {
        background: var(--accent-soft);
      }
      .sidebar-footer {
        border-top: 1px solid var(--line);
        padding-top: 14px;
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .gateway-button {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        text-align: left;
        gap: 10px;
        padding: 6px;
        border-radius: 9px;
      }
      .gateway-button:hover {
        background: var(--hover);
      }
      .gateway-avatar {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--raised);
        display: grid;
        place-items: center;
        color: var(--muted);
        border: 1px solid var(--line);
        flex-shrink: 0;
      }
      .gateway-copy {
        display: grid;
        min-width: 0;
        gap: 1px;
      }
      .gateway-copy strong {
        font-size: 12px;
        font-weight: 550;
      }
      .gateway-copy small {
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .connection-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        display: inline-block;
        margin-right: 5px;
      }
      .connected .connection-dot {
        background: var(--success);
      }
      .main {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        height: 78px;
        flex-shrink: 0;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 0 28px;
      }
      .toolbar-heading {
        min-width: 0;
        flex: 1;
      }
      #session-title {
        font-size: 14px;
        font-weight: 620;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        letter-spacing: -0.2px;
      }
      #session-info {
        font-size: 11px;
        color: var(--muted);
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        margin-top: 3px;
      }
      .toolbar-pill {
        font-size: 11px;
        color: var(--muted);
        padding: 5px 10px;
        border-radius: 20px;
        background: var(--surface);
        white-space: nowrap;
      }
      .conversation {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #history {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 36px clamp(20px, 5vw, 72px) 26px;
        scrollbar-width: thin;
        scroll-behavior: smooth;
      }
      .welcome {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        max-width: 670px;
        margin: auto;
        padding: 24px 0 40px;
      }
      .welcome .app-icon {
        width: 62px;
        height: 62px;
        border-radius: 19px;
        margin-bottom: 26px;
        box-shadow:
          0 7px 18px #00000016,
          inset 0 1px 1px #ffffff3b;
      }
      .welcome .app-icon .icon {
        width: 34px;
        height: 34px;
      }
      .welcome h2 {
        font-size: 34px;
        line-height: 1.3;
        font-weight: 620;
        letter-spacing: -1.3px;
      }
      .welcome p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
        margin-top: 12px;
        max-width: 380px;
      }
      .welcome-action {
        margin-top: 23px;
      }
      .primary {
        background: #007aff;
        color: #fff;
        box-shadow: 0 1px 3px #007aff26;
        border-radius: 9px;
        padding: 10px 18px;
        font-weight: 550;
      }
      .primary:hover {
        background: #006ae0;
      }
      .secondary {
        background: var(--surface);
        border-radius: 9px;
        padding: 10px 16px;
      }
      .secondary:hover {
        background: var(--hover);
      }
      .suggestions {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 11px;
        margin-top: 44px;
      }
      .suggestion {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
        gap: 7px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .suggestion:hover {
        background: var(--surface);
        border-color: var(--accent);
      }
      .suggestion .icon {
        color: var(--muted);
        margin-bottom: 5px;
      }
      .suggestion strong {
        font-size: 12px;
        font-weight: 550;
      }
      .suggestion small {
        font-size: 11px;
        line-height: 1.6;
      }
      .turn {
        max-width: 790px;
        margin: 0 auto 33px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 15px;
      }
      .bubble {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.75;
      }
      .user-message {
        align-self: flex-end;
        max-width: 85%;
        background: var(--surface);
        padding: 12px 17px;
        border-radius: 18px 18px 5px 18px;
        font-size: 14px;
      }
      .assistant-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        margin: 3px 0 -5px;
      }
      .assistant-label .assistant-mark {
        width: 22px;
        height: 22px;
        background: var(--surface);
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 11px;
      }
      .answer {
        font-size: 14px;
        white-space: normal;
        padding-left: 30px;
        line-height: 1.85;
      }
      .answer p {
        margin: 0 0 12px;
        white-space: pre-wrap;
      }
      .answer p:last-child {
        margin-bottom: 0;
      }
      .answer h2,
      .answer h3,
      .answer h4 {
        margin: 20px 0 10px;
        font-weight: 600;
        line-height: 1.5;
      }
      .answer h2 {
        font-size: 21px;
      }
      .answer h3 {
        font-size: 18px;
      }
      .answer h4 {
        font-size: 15px;
      }
      .answer ul,
      .answer ol {
        margin: 8px 0 14px;
        padding-left: 23px;
      }
      .answer li {
        padding: 2px 0;
      }
      .answer code {
        font:
          12px/1.7 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        background: var(--surface);
        padding: 2px 5px;
        border-radius: 4px;
      }
      .answer a {
        color: var(--accent);
        text-decoration: none;
      }
      .answer a:hover {
        text-decoration: underline;
      }
      .code-block {
        min-width: 0;
        max-width: 100%;
        margin: 14px 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .code-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 10px;
        color: var(--muted);
      }
      .code-copy {
        display: flex;
        align-items: center;
        gap: 5px;
        color: var(--muted);
        padding: 4px 6px;
        border-radius: 5px;
        font-size: 10px;
      }
      .code-copy .icon {
        width: 12px;
        height: 12px;
      }
      .code-copy:hover {
        background: var(--hover);
      }
      .code-block pre {
        margin: 0;
        padding: 15px;
        overflow: auto;
        max-width: 100%;
        font:
          12px/1.8 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre;
      }
      .code-block pre code {
        padding: 0;
        background: transparent;
      }
      .turn-state {
        padding-left: 30px;
        color: var(--muted);
        font-size: 10px;
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .turn-state .icon {
        width: 12px;
        height: 12px;
      }
      .turn-state.failed {
        color: var(--error);
      }
      #stream-preview {
        max-height: 160px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 0 30px 14px;
        font-size: 13px;
        color: var(--muted);
        max-width: 850px;
        width: 100%;
        margin: 0 auto;
      }
      #approvals {
        max-height: 38vh;
        overflow: auto;
        max-width: 850px;
        width: 100%;
        margin: 0 auto;
        padding: 0 24px;
      }
      #approvals:empty,
      #stream-preview:empty {
        display: none;
      }
      .approval {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
      }
      .approval > strong {
        display: block;
        font-size: 13px;
        margin-bottom: 9px;
      }
      .approval pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 120px;
        overflow: auto;
        font-size: 12px;
      }
      .approval label {
        margin: 12px 0;
      }
      .approval .row {
        margin-top: 12px;
      }
      .danger {
        color: var(--error);
      }
      .composer-wrap {
        padding: 6px clamp(20px, 5vw, 72px)
          max(14px, env(safe-area-inset-bottom));
        flex-shrink: 0;
      }
      .composer {
        max-width: 790px;
        margin: auto;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 5px 7px 7px;
        box-shadow: 0 3px 16px #00000006;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .composer:focus-within {
        border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
        box-shadow: 0 3px 18px #00000008;
      }
      .composer textarea {
        min-height: 65px;
        max-height: 180px;
        padding: 13px 13px 5px;
        background: transparent;
        border: 0;
        border-radius: 13px;
        line-height: 1.6;
        display: block;
        font-size: 14px;
      }
      .composer textarea:focus-visible {
        outline: none;
      }
      .composer-actions {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 2px 0 11px;
        min-height: 36px;
      }
      .composer-context {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 1;
        min-width: 0;
      }
      .composer-context .icon {
        width: 12px;
        height: 12px;
      }
      .composer-context span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #cancel {
        font-size: 11px;
        color: var(--error);
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 7px;
        border-radius: 8px;
      }
      #cancel .icon {
        width: 13px;
        height: 13px;
      }
      #cancel:disabled {
        display: none;
      }
      .send-button {
        width: 34px;
        height: 34px;
        background: #007aff;
        color: #fff;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .send-button:hover {
        background: #006ae0;
      }
      .send-button .icon {
        width: 19px;
        height: 19px;
        stroke-width: 2.3;
      }
      .composer-footnote {
        max-width: 790px;
        margin: 9px auto 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 10px;
        color: var(--muted);
      }
      .composer-footnote .keys {
        font-size: 10px;
        opacity: 0.8;
      }
      .status-banner:not(.error) {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      .status-banner.error {
        position: absolute;
        z-index: 5;
        top: 10px;
        left: 24px;
        right: 24px;
        margin: auto;
        max-width: 730px;
        background: var(--raised);
        border: 1px solid var(--error);
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 12px;
        color: var(--error);
        box-shadow: var(--shadow);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .row > button {
        flex: 0 0 auto;
      }
      dialog {
        color: var(--ink);
        background: var(--bg);
        width: min(460px, calc(100vw - 32px));
        max-height: calc(100dvh - 40px);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 0;
        box-shadow: 0 24px 90px #0003;
        overflow: auto;
      }
      dialog::backdrop {
        background: rgba(15, 18, 24, 0.26);
        backdrop-filter: blur(7px);
      }
      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 24px 12px;
      }
      .dialog-header h2 {
        font-size: 20px;
        font-weight: 620;
        letter-spacing: -0.6px;
      }
      .dialog-content {
        padding: 10px 24px 26px;
      }
      .dialog-subtitle {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
        margin-bottom: 22px;
      }
      .form-fields {
        display: grid;
        gap: 18px;
      }
      label {
        display: grid;
        gap: 7px;
        font-size: 12px;
        font-weight: 550;

          inset: 0;
          background: #0005;
          backdrop-filter: blur(3px);
          z-index: 30;

        .sidebar-collapsed .app {
          grid-template-columns: 1fr;
        }
        .toolbar {

        }
        .toolbar .icon-button {

          height: 40px;

        .suggestions {

    <div class="app">

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const mount = location.pathname
        .replace(/\/console\/?$/, "")
        .replace(/\/$/, "");
      const storageKey = "rcgToken:" + mount;
      const states = {
        queued: "等待执行",
        running: "正在执行",
        completed: "已完成",
        failed: "执行失败",
        cancelled: "已停止",
        interrupted: "网关重启，任务已中断",
        timed_out: "执行超时",
      };
      const modes = {
        readonly: "只读 · 查看与分析",
        ask: "审批 · 写入工作目录，敏感操作需确认",
        auto: "自动 · 允许修改工作目录",
        full: "完整访问 · 无沙箱限制",
      };
      let credential = "",
        connected = false,
        selected = null,
        sessions = [],
        turns = [],
        sessionCursor = 0,
        historyCursor = 0;
      let streamController = null,
        streamTimer = null,
        pollTimer = null,
        refreshTimer = null,
        selection = 0,
        connection = 0,
        refreshing = false,
        refreshAgain = false,
        sending = false,
        creating = false,
        newAfterConnect = false,
        draftPrompt = "",
        pendingAttempt = null;
      let eventLines = [],
        preview = "",
        busyTurn = null,
        historySignature = "",
        approvalSignature = "";
      function status(message, error = false) {
        $("status").textContent = message;
        $("status").classList.toggle("error", error);
        $("connection-feedback").textContent = message;
        $("connection-feedback").classList.toggle("error", error);
        if (error) {
          clearTimeout(status.timer);
          status.timer = setTimeout(
            () => $("status").classList.remove("error"),
            8000,
          );
        }
      }
      function elem(tag, text, cls) {
        const el = document.createElement(tag);
        if (text !== undefined) el.textContent = text;
        if (cls) el.className = cls;
        return el;
      }
      function remember(value) {
        try {
          if (value) sessionStorage.setItem(storageKey, value);
          else sessionStorage.removeItem(storageKey);
        } catch {}
      }
      function icon(name) {
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );

      function inlineMarkdown(target, text) {

          /(`[^`\n]+`|\*\*[^*\n]+\*\*|\[[^\]\n]+\]\(https?:\/\/[^\s)]+\))/g;
        let offset = 0;
        for (const match of text.matchAll(pattern)) {
          target.append(
            document.createTextNode(text.slice(offset, match.index)),
          );
          const value = match[0];
          if (value.startsWith("`"))
            target.append(elem("code", value.slice(1, -1)));
          else if (value.startsWith("**"))
            target.append(elem("strong", value.slice(2, -2)));

            const parts = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(value);

            link.href = parts[2];
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            target.append(link);

          if (fence) {
            flush();

            while (++index < lines.length && !/^\s*```\s*$/.test(lines[index]))
              content.push(lines[index]);
            const value = content.join("\n");

            const heading = elem("div", undefined, "code-heading");
            const copy = elem("button", undefined, "code-copy");
            copy.type = "button";

      let savedTheme;
      try {
        savedTheme = localStorage.getItem("rcgTheme");
      } catch {}
      setTheme(
        savedTheme
          ? savedTheme === "dark"
          : matchMedia("(prefers-color-scheme: dark)").matches,
      );
      matchMedia("(prefers-color-scheme: dark)").addEventListener(
        "change",
        (event) => {
          let manual;
          try {
            manual = localStorage.getItem("rcgTheme");
          } catch {}
          if (!manual) setTheme(event.matches);
        },
      );
      $("disconnect").onclick = disconnect;
      $("refresh").onclick = () =>
        loadSessions().catch((error) => status(error.message, true));
      $("more-sessions").onclick = async () => {
        const button = $("more-sessions");
        button.disabled = true;
        try {
          await loadSessions(true);
        } catch (error) {
          status(error.message, true);
        } finally {
          button.disabled = false;
        }
      };
      $("more-history").onclick = async () => {
        const epoch = selection;
        const button = $("more-history");
        button.disabled = true;
        try {
          const data = await api(
            "/api/sessions/" +
              selected.id +
              "/history?limit=100&before=" +
              historyCursor,
          );
          if (epoch !== selection) return;
          const ids = new Set(turns.map((t) => t.id));
          turns.push(...(data.turns || []).filter((t) => !ids.has(t.id)));
          historyCursor = data.next_before || 0;
          renderHistory();
          button.hidden = !historyCursor;
        } catch (error) {
          status(error.message, true);
        } finally {
          button.disabled = false;
        }
      };
      $("create-form").onsubmit = async (event) => {
        event.preventDefault();
        if ($("create").disabled) return;
        const epoch = connection;
        creating = true;
        $("create").disabled = true;
        try {
          const data = await api("/api/sessions", {
            method: "POST",
            body: JSON.stringify({
              title: $("title").value.trim(),
              runtime: $("runtime").value,
              workspace: $("workspace").value,
              mode: $("mode").value,
              model: $("model").value.trim(),
            }),
          });
          if (epoch !== connection || !connected) return;
          await loadSessions();
          if (epoch !== connection || !connected) return;
          await selectSession(data.session);
          $("new-session").close();
          $("title").value = "";
          if (draftPrompt) {
            $("prompt").value = draftPrompt;
            draftPrompt = "";
          }
          $("prompt").focus();
          status("会话已创建。");
        } catch (error) {
          status(error.message, true);
        } finally {
          creating = false;
          controls();
        }
      };
      $("prompt-form").onsubmit = async (event) => {
        event.preventDefault();
        const prompt = $("prompt").value.trim();
        if (!prompt || $("send").disabled) return;
        const epoch = selection;
        const id = selected.id;
        sending = true;
        controls();
        try {
          if (
            !pendingAttempt ||
            pendingAttempt.session_id !== id ||
            pendingAttempt.prompt !== prompt
          ) {
            const bytes = crypto.getRandomValues(new Uint8Array(16));
            pendingAttempt = {
              session_id: id,
              prompt,
              idempotency_key: Array.from(bytes, (b) =>
                b.toString(16).padStart(2, "0"),
              ).join(""),
            };
          }
          await api("/api/turns", {
            method: "POST",
            body: JSON.stringify(pendingAttempt),
          });
          pendingAttempt = null;
          if (epoch === selection) {
            $("prompt").value = "";
            preview = "";
            await refreshView(epoch);
            $("history").scrollTop = $("history").scrollHeight;
            status("任务已提交。");
          }
        } catch (error) {
          status(error.message, true);
        } finally {
          sending = false;
          controls();
        }
      };
      $("prompt").onkeydown = (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          $("prompt-form").requestSubmit();
        }
      };
      $("cancel").onclick = async () => {
        if (!busyTurn) return;
        $("cancel").disabled = true;
        try {
          await api("/api/turns/" + busyTurn.id + "/cancel", {
            method: "POST",
          });
          await refreshView(selection);
          status("已请求停止任务。");
        } catch (error) {
          status(error.message, true);
          controls();
        }
      };
      window.addEventListener("pagehide", stopWatch);
      matchMedia("(max-width: 760px)").addEventListener("change", (event) => {
        closeSidebar();
      });
      try {
        $("token").value = sessionStorage.getItem(storageKey) || "";
      } catch {}
      function consumeTokenFragment() {
        const fragment = new URLSearchParams(location.hash.slice(1));
        if (!fragment.has("token")) return false;
        $("token").value = fragment.get("token");
        history.replaceState(null, "", location.pathname + location.search);
        return true;
      }
      window.addEventListener("hashchange", () => {
        if (consumeTokenFragment()) establish();
      });
      consumeTokenFragment();
      renderWelcome();
      renderSessions();
      controls();
      closeSidebar();
      if ($("token").value) establish();
    </script>
  </body>
</html>
